        function submitDedicace(e) {
            e.preventDefault();
            const name = document.getElementById('dedicace-name').value;
            alert("Merci " + name + " ! Votre dédicace a bien été transmise au studio de Radio Vicomté.");
            document.getElementById('dedicace-form').reset();
