        function setDay(dayKey) {
            // Update tabs style
            document.querySelectorAll('.day-tab').forEach(btn => {
                btn.className = "day-tab px-4 py-2 rounded-xl text-xs font-semibold bg-vicomte-card border border-vicomte-border text-gray-300 hover:bg-vicomte-border transition";
            });
            event.target.className = "day-tab px-4 py-2 rounded-xl text-xs font-semibold bg-vicomte-gold text-black transition";

            // Render programs
            const container = document.getElementById('programs-container');
            container.innerHTML = '';

            programsData[dayKey].forEach(prog => {
                const card = document.createElement('div');
                card.className = "bg-vicomte-card border border-vicomte-border rounded-2xl p-5 hover:border-vicomte-gold/50 transition flex flex-col justify-between";
                card.innerHTML = `
                    <div>
                        <span class="text-xs font-semibold text-vicomte-gold"><i class="fa-regular fa-clock"></i> ${prog.time}</span>
                        <h4 class="font-serif font-bold text-lg mt-2 mb-1">${prog.title}</h4>
                        <p class="text-xs text-gray-400 mb-3">Par <span class="text-white">${prog.host}</span></p>
                        <p class="text-xs text-gray-400 leading-relaxed">${prog.desc}</p>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // Initialize with Monday programs on load
        window.addEventListener('DOMContentLoaded', () => {
            // Simulate click on Monday tab
            const firstTab = document.querySelector('.day-tab');
            if(firstTab) {
                // Render default lun
                const container = document.getElementById('programs-container');
                programsData['lun'].forEach(prog => {
                    const card = document.createElement('div');
                    card.className = "bg-vicomte-card border border-vicomte-border rounded-2xl p-5 hover:border-vicomte-gold/50 transition flex flex-col justify-between";
